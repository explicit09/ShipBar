name: ShipBar
options:
  bundleIdPrefix: com.tadies
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  ShipBarMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/Mac
    info:
      path: Config/Mac/Info.plist
      properties:
        CFBundleDisplayName: ShipBar
        LSUIElement: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: true
    entitlements:
      path: Config/Mac/ShipBarMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.tadies.ShipBar
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tadies.ShipBar.mac
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  ShipBariOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
    dependencies:
      - target: ShipBarShareExtension
    info:
      path: Config/iOS/Info.plist
      properties:
        CFBundleDisplayName: ShipBar
        UILaunchScreen: {}
    entitlements:
      path: Config/iOS/ShipBariOS.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.tadies.ShipBar
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.tadies.ShipBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tadies.ShipBar
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  ShipBarShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/ShareExtension
      - path: Sources/Shared/Capture
      - path: Sources/Shared/Models/ProjectToken.swift
      - path: Sources/Shared/Models/TaskPriority.swift
      - path: Sources/Shared/Models/TaskStatus.swift
      - path: Sources/Shared/Models/TaskType.swift
    info:
      path: Config/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: ShipBar
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShipBarShareViewController
          NSExtensionAttributes:
            NSExtensionActivationSupportsText: true
            NSExtensionActivationSupportsWebURLWithMaxCount: 1
            NSExtensionActivationSupportsWebPageWithMaxCount: 1
    entitlements:
      path: Config/ShareExtension/ShipBarShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tadies.ShipBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tadies.ShipBar.ShareExtension
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        APPLICATION_EXTENSION_API_ONLY: YES
  ShipBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Shared/Models
      - path: Sources/Shared/Capture
      - path: Sources/Shared/Persistence
      - path: Sources/Shared/Tasks
      - path: Tests/ShipBarTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tadies.ShipBarTests
        GENERATE_INFOPLIST_FILE: YES
