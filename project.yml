name: ShipBar
options:
  bundleIdPrefix: com.tadies
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  ShipBarMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/Mac
      - path: Resources/Mac
        buildPhase: resources
    dependencies:
      - target: ShipBarCLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: Config/Mac/Info.plist
      properties:
        CFBundleDisplayName: ShipBar
        LSUIElement: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: true
        NSMicrophoneUsageDescription: ShipBar uses the microphone for voice capture with the OpenAI realtime model.
    entitlements:
      path: Config/Mac/ShipBarMac.entitlements
      properties:
        com.apple.developer.aps-environment: development
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - com.apple.cloudd
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/ShipBarBridge/
        com.apple.security.application-groups:
          - group.com.tadies.ShipBar
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.tadies.ShipBar
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tadies.ShipBar.mac
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5986DKD528
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ShipBariOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
      - path: Sources/Mac/Voice/AudioPipeline.swift
      - path: Sources/Mac/Voice/KeychainStore.swift
      - path: Sources/Mac/Voice/RealtimeClient.swift
      - path: Sources/Mac/Voice/VoiceSession.swift
      - path: Sources/Mac/Voice/VoiceTools.swift
      - path: Resources/iOS
        buildPhase: resources
    dependencies:
      - target: ShipBarShareExtension
    info:
      path: Config/iOS/Info.plist
      properties:
        CFBundleDisplayName: ShipBar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.tadies.ShipBar
            CFBundleURLSchemes:
              - shipbar
        NSMicrophoneUsageDescription: ShipBar uses the microphone for voice capture with the OpenAI realtime model.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
          - remote-notification
        UILaunchScreen: {}
    entitlements:
      path: Config/iOS/ShipBariOS.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.tadies.ShipBar
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.tadies.ShipBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tadies.ShipBar
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5986DKD528
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ShipBarShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/ShareExtension
      - path: Sources/Shared/Capture
      - path: Sources/Shared/Models/ProjectToken.swift
      - path: Sources/Shared/Models/TaskPriority.swift
      - path: Sources/Shared/Models/TaskStatus.swift
      - path: Sources/Shared/Models/TaskType.swift
    info:
      path: Config/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: ShipBar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShipBarShareViewController
          NSExtensionAttributes:
            NSExtensionActivationSupportsText: true
            NSExtensionActivationSupportsWebURLWithMaxCount: 1
            NSExtensionActivationSupportsWebPageWithMaxCount: 1
    entitlements:
      path: Config/ShareExtension/ShipBarShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tadies.ShipBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tadies.ShipBar.ShareExtension
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5986DKD528
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
  ShipBarCLI:
    type: tool
    platform: macOS
    sources:
      - path: Sources/CLI
      - path: Sources/Shared/Bridge
      - path: Sources/Shared/Capture
      - path: Sources/Shared/Models/ProjectToken.swift
      - path: Sources/Shared/Models/TaskPriority.swift
      - path: Sources/Shared/Models/TaskStatus.swift
      - path: Sources/Shared/Models/TaskType.swift
    entitlements:
      path: Config/CLI/ShipBarCLI.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tadies.ShipBar
    settings:
      base:
        PRODUCT_NAME: shipbarctl
        PRODUCT_BUNDLE_IDENTIFIER: com.tadies.ShipBar.shipbarctl
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5986DKD528
  ShipBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Shared/Models
      - path: Sources/Shared/Bridge
      - path: Sources/Shared/Capture
      - path: Sources/Shared/Persistence
      - path: Sources/Shared/Tasks
      - path: Sources/Shared/Utilities/ShipBarDeepLink.swift
      - path: Sources/Shared/Utilities/ShipBarLaunchOptions.swift
      - path: Sources/Shared/Utilities/ShipBarNotifications.swift
      - path: Sources/CLI/ShipBarCLICore.swift
      - path: Sources/Mac/Bridge
      - path: Sources/Mac/StatusMenuTextFitter.swift
      - path: Sources/Mac/Voice/AudioPipeline.swift
      - path: Sources/Mac/Voice/RealtimeClient.swift
      - path: Tests/ShipBarTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tadies.ShipBarTests
        GENERATE_INFOPLIST_FILE: YES
